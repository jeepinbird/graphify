[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphifyy"
version = "0.8.35"
description = "Claude Code skill that turns a folder of Python, Go, SQL, and Markdown / knowledge-base files into a queryable relationship graph"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["claude", "claude-code", "knowledge-graph", "python", "go", "markdown", "sql", "rag", "graphrag", "obsidian", "community-detection", "tree-sitter", "leiden", "llm"]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4",
    "datasketch>=1.6",
    "rapidfuzz>=3.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-sql",
    "tree-sitter-python",
    "tree-sitter-go",
]

[project.urls]
Homepage = "https://github.com/safishamsi/graphify"
Repository = "https://github.com/safishamsi/graphify"
Issues = "https://github.com/safishamsi/graphify/issues"

[project.optional-dependencies]
mcp = ["mcp"]
neo4j = ["neo4j"]
watch = ["watchdog"]
svg = ["matplotlib", "numpy>=2.0; python_version >= '3.13'"]
leiden = ["graspologic; python_version < '3.13'"]
kimi = ["openai", "tiktoken"]
ollama = ["openai"]
bedrock = ["boto3"]
anthropic = ["anthropic"]
gemini = ["openai", "tiktoken"]
openai = ["openai", "tiktoken"]
all = ["mcp", "neo4j", "watchdog", "graspologic; python_version < '3.13'", "matplotlib", "numpy>=2.0; python_version >= '3.13'", "openai", "tiktoken", "boto3", "anthropic"]

[project.scripts]
graphify = "graphify.__main__:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "build>=1.5.0",
    "hypothesis>=6.152.7",
    "nuitka>=4.1",
    "patchelf>=0.17.2.4 ; sys_platform != 'win32'",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "safety>=3.7.0",
    "setuptools>=82.0.1",
    "wheel>=0.47.0",
    "tomli>=2.0 ; python_version < '3.11'",
]

[tool.uv]
# Install via: uv tool install graphifyy
# Run without installing: uvx graphifyy install
package = true

[tool.setuptools]
packages = ["graphify"]
include-package-data = false

[tool.setuptools.package-data]
# The skill body ships as graphify/skill.md (copied to .claude/skills/graphify/
# SKILL.md on install). The progressive-disclosure references sidecar ships under
# graphify/skills/claude/references/, and the always-on injection block under
# graphify/always_on/.
graphify = ["skill.md", "skills/*/references/*.md", "always_on/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "graphify-benchmark", "graphify_eval", "graphify_test",
    "worked", "llm-stack-corpus", "llm-stack-demo", "product-site",
    "scripts", "ebook", ".github", "dist", "build",
]

[tool.bandit]
skips = ["B404"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the committed baseline conservative until upstream adopts a broader lint policy.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["graphify", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
